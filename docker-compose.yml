##version: '3.8'

services:
  db:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: operation-server
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5444:5432"

  backend:
    build: .
    ports:
      - "4444:4445"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/operation-server
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password


volumes:
  pgdata: